<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard Minna no Nihongo - Bài 5</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Plus Jakarta Sans', sans-serif; }
        
        body {
            background: linear-gradient(rgba(255, 245, 247, 0.55), rgba(240, 220, 225, 0.65)),
                        url('https://images.unsplash.com/photo-1522383225653-ed111181a951?q=80&w=1920&auto=format&fit=crop') center/cover no-repeat fixed;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
        }

        /* Hiệu ứng Cánh hoa anh đào rơi */
        .sakura-container { position: fixed; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 1; }
        .petal {
            position: absolute;
            background: #ffb7c5;
            border-radius: 15px 0 15px 0;
            opacity: 0.75;
            filter: drop-shadow(0 2px 4px rgba(216, 90, 127, 0.2));
            animation: fall linear infinite;
        }
        @keyframes fall {
            0% { transform: translate(0, -10px) rotate(0deg); opacity: 0.8; }
            100% { transform: translate(120px, 105vh) rotate(360deg); opacity: 0; }
        }

        .app-card {
            position: relative;
            z-index: 2;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            width: 100%;
            max-width: 460px;
            border-radius: 28px;
            padding: 32px 24px;
            border: 1.5px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 20px 40px rgba(180, 100, 120, 0.15);
            text-align: center;
        }

        .header { display: flex; justify-content: space-between; font-size: 14px; font-weight: 600; color: #b06d7e; margin-bottom: 20px; }

        /* Flashcard Lật 3D */
        .flashcard-wrapper {
            perspective: 1000px;
            width: 100%;
            height: 230px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s cubic-bezier(0.4, 0.2, 0.2, 1);
            border-radius: 20px;
            box-shadow: 0 8px 20px rgba(216, 90, 127, 0.12);
        }
        .flashcard.flipped { transform: rotateY(180deg); }

        .card-front, .card-back {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            border-radius: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border: 2px solid #f2d5db;
            background: #ffffff;
            padding: 16px;
        }
        .card-front { color: #3a2e30; }
        .card-back {
            background: #fff8f9;
            color: #d85a7f;
            transform: rotateY(180deg);
        }

        .kanji-text { font-size: 38px; font-weight: 700; letter-spacing: 2px; }
        .hint-text { font-size: 12px; color: #b06d7e; margin-top: 10px; opacity: 0.8; }
        
        .hiragana-text { font-size: 22px; font-weight: 600; color: #d85a7f; margin-bottom: 2px; }
        .meaning-text { font-size: 18px; font-weight: 700; color: #4a383b; margin-bottom: 10px; }
        
        /* Khung câu ví dụ */
        .example-box {
            background: rgba(216, 90, 127, 0.08);
            border-left: 3px solid #d85a7f;
            padding: 8px 12px;
            border-radius: 8px;
            font-size: 13px;
            color: #5a4046;
            text-align: left;
            width: 100%;
        }
        .example-jp { font-weight: 600; color: #3a2e30; }
        .example-vi { font-size: 12px; color: #7a5c63; }

        /* Danh sách 4 lựa chọn tiếng Việt */
        .options-grid { display: flex; flex-direction: column; gap: 10px; }
        .opt-btn {
            background: rgba(255, 255, 255, 0.9);
            border: 1.5px solid #f2d5db;
            color: #4a383b;
            padding: 12px 14px;
            border-radius: 16px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            text-align: left;
        }
        .opt-btn:hover:not(:disabled) { background: #fff5f7; border-color: #d85a7f; transform: translateY(-1px); }
        .opt-btn.correct { background: #e8f5e9 !important; border-color: #66bb6a !important; color: #2e7d32 !important; }
        .opt-btn.wrong { background: #ffebee !important; border-color: #ef5350 !important; color: #c62828 !important; }
        .opt-btn:disabled { cursor: default; }

        .controls { display: flex; gap: 10px; margin-top: 16px; }
        .nav-btn {
            flex: 1; padding: 12px; border: none; background: #f2d5db; color: #8c5665;
            font-weight: 600; border-radius: 14px; cursor: pointer; transition: 0.2s;
        }
        .nav-btn:hover { background: #d85a7f; color: white; }

        /* Màn hình Chúc mừng khi hoàn thành */
        .congrats-card {
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px 10px;
        }
        .congrats-icon { font-size: 60px; margin-bottom: 12px; }
        .congrats-title { font-size: 24px; font-weight: 700; color: #d85a7f; margin-bottom: 8px; }
        .congrats-desc { font-size: 15px; color: #5a4046; margin-bottom: 24px; line-height: 1.5; }
        .restart-btn {
            background: linear-gradient(135deg, #e07a9e 0%, #d85a7f 100%);
            color: white; border: none; padding: 14px 32px; border-radius: 16px;
            font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s;
            box-shadow: 0 4px 12px rgba(216, 90, 127, 0.3);
        }
        .restart-btn:hover { opacity: 0.95; transform: translateY(-2px); }
    </style>
</head>
<body>

    <div class="sakura-container" id="sakura-box"></div>

    <div class="app-card">
        <!-- Khung học Flashcard chính -->
        <div id="learning-section">
            <div class="header">
                <span id="lesson-title">Minna no Nihongo - Bài 5</span>
                <span id="card-count">1 / 34</span>
            </div>

            <!-- Flashcard lật 3D -->
            <div class="flashcard-wrapper" onclick="toggleFlip()">
                <div class="flashcard" id="card">
                    <div class="card-front">
                        <div class="kanji-text" id="kanji-display">行きます</div>
                        <div class="hint-text">💡 Chạm vào đây để lật xem cách đọc & ví dụ</div>
                    </div>
                    <div class="card-back">
                        <div class="hiragana-text" id="hiragana-display">いきます</div>
                        <div class="meaning-text" id="meaning-display">Đi</div>
                        <div class="example-box">
                            <div class="example-jp" id="example-jp">わたしは 京都へ 行きます。</div>
                            <div class="example-vi" id="example-vi">Tôi sẽ đi Kyoto.</div>
                        </div>
                    </div>
                </div>
            </div>

            <!-- 4 Lựa chọn trắc nghiệm tiếng Việt -->
            <div class="options-grid" id="options-box">
                <button class="opt-btn" onclick="checkAnswer(this)"></button>
                <button class="opt-btn" onclick="checkAnswer(this)"></button>
                <button class="opt-btn" onclick="checkAnswer(this)"></button>
                <button class="opt-btn" onclick="checkAnswer(this)"></button>
            </div>

            <!-- Điều hướng -->
            <div class="controls">
                <button class="nav-btn" onclick="prevCard()">← Thẻ trước</button>
                <button class="nav-btn" onclick="nextCard()">Thẻ tiếp →</button>
            </div>
        </div>

        <!-- Màn hình Chúc mừng sau khi hoàn thành -->
        <div class="congrats-card" id="congrats-section">
            <div class="congrats-icon">🌸🎉</div>
            <div class="congrats-title">おめでとうございます!</div>
            <div class="congrats-desc">
                Chúc mừng bạn đã hoàn thành trọn bộ <strong>34 từ vựng Bài 5</strong>!<br>
                Điểm số trả lời đúng: <strong id="score-text" style="color:#d85a7f;">0/34</strong>
            </div>
            <button class="restart-btn" onclick="restartLesson()">🔄 Học lại Bài 5</button>
        </div>
    </div>

    <script>
        function createPetal() {
            const box = document.getElementById('sakura-box');
            const p = document.createElement('div');
            p.classList.add('petal');
            p.style.width = Math.random() * 8 + 8 + 'px';
            p.style.height = Math.random() * 10 + 10 + 'px';
            p.style.left = Math.random() * 100 + 'vw';
            p.style.animationDuration = Math.random() * 4 + 6 + 's';
            box.appendChild(p);
            setTimeout(() => p.remove(), 10000);
        }
        setInterval(createPetal, 400);

        // Danh sách từ vựng Bài 5 trích xuất chính xác từ sách Minna no Nihongo I
        const vocabList = [
            { kanji: '行きます', hiragana: 'いきます', meaning: 'Đi', exJp: 'わたしは 京都へ 行きます。', exVi: 'Tôi sẽ đi Kyoto.' },
            { kanji: '来ます', hiragana: 'きます', meaning: 'Đến', exJp: '家族と 日本へ 来ました。', exVi: 'Tôi đã đến Nhật Bản cùng với gia đình.' },
            { kanji: '帰ります', hiragana: 'かえります', meaning: 'Về', exJp: 'タクシーで うちへ 帰ります。', exVi: 'Tôi sẽ về nhà bằng xe tắc-xi.' },
            { kanji: '学校', hiragana: 'がっこう', meaning: 'Trường học', exJp: '歩いて 学校へ 行きます。', exVi: 'Tôi đi bộ đến trường.' },
            { kanji: 'スーパー', hiragana: 'すーぱー', meaning: 'Siêu thị', exJp: 'スーパーへ 行きます。', exVi: 'Tôi đi siêu thị.' },
            { kanji: '駅', hiragana: 'えき', meaning: 'Nhà ga', exJp: '駅から 歩いて 帰りました。', exVi: 'Tôi đã đi bộ từ nhà ga về.' },
            { kanji: '飛行機', hiragana: 'ひこうき', meaning: 'Máy bay', exJp: '飛行機で 日本へ 来ました。', exVi: 'Tôi đã đến Nhật Bản bằng máy bay.' },
            { kanji: '船', hiragana: 'ふね', meaning: 'Thuyền / Tàu thủy', exJp: '船で 韓国へ 行きます。', exVi: 'Tôi đi Hàn Quốc bằng tàu thủy.' },
            { kanji: '電車', hiragana: 'でんしゃ', meaning: 'Tàu điện', exJp: '電車で 会社へ 行きます。', exVi: 'Tôi đi làm bằng tàu điện.' },
            { kanji: '地下鉄', hiragana: 'ちかてつ', meaning: 'Tàu điện ngầm', exJp: '地下鉄で 行きます。', exVi: 'Tôi đi bằng tàu điện ngầm.' },
            { kanji: '新幹線', hiragana: 'しんかんせん', meaning: 'Tàu Shinkansen', exJp: '新幹線で 東京へ 行きます。', exVi: 'Tôi đi Tokyo bằng tàu Shinkansen.' },
            { kanji: 'バス', hiragana: 'ばす', meaning: 'Xe buýt', exJp: 'バスで 病院へ 行きます。', exVi: 'Tôi đi đến bệnh viện bằng xe buýt.' },
            { kanji: 'タクシー', hiragana: 'たくしー', meaning: 'Xe tắc-xi', exJp: 'タクシーで 帰ります。', exVi: 'Tôi sẽ về bằng xe tắc-xi.' },
            { kanji: '自転車', hiragana: 'じてんしゃ', meaning: 'Xe đạp', exJp: '自転車で 学校へ 行きます。', exVi: 'Tôi đi học bằng xe đạp.' },
            { kanji: '歩いて', hiragana: 'あるいて', meaning: 'Đi bộ', exJp: '歩いて うちへ 帰ります。', exVi: 'Tôi đi bộ về nhà.' },
            { kanji: '人', hiragana: 'ひと', meaning: 'Người', exJp: '会社の人と 行きます。', exVi: 'Tôi đi cùng với người trong công ty.' },
            { kanji: '友達', hiragana: 'ともだち', meaning: 'Bạn / Bạn bè', exJp: '友達と 京都へ 行きます。', exVi: 'Tôi đi Kyoto cùng với bạn.' },
            { kanji: '彼', hiragana: 'かれ', meaning: 'Anh ấy / Bạn trai', exJp: '彼と 映画へ 行きます。', exVi: 'Tôi đi xem phim với anh ấy.' },
            { kanji: '彼女', hiragana: 'かのじょ', meaning: 'Chị ấy / Bạn gái', exJp: '彼女と 美術館へ 行きます。', exVi: 'Tôi đi bảo tàng mỹ thuật với bạn gái.' },
            { kanji: '家族', hiragana: 'かぞく', meaning: 'Gia đình', exJp: '家族と 日本へ 来ました。', exVi: 'Tôi đã đến Nhật Bản cùng với gia đình.' },
            { kanji: '一人で', hiragana: 'ひとり・で', meaning: 'Một mình', exJp: '一人で 東京へ 行きます。', exVi: 'Tôi đi Tokyo một mình.' },
            { kanji: '先週', hiragana: 'せんしゅう', meaning: 'Tuần trước', exJp: '先週 どこへ 行きましたか。', exVi: 'Tuần trước bạn đã đi đâu?' },
            { kanji: '今週', hiragana: 'こんしゅう', meaning: 'Tuần này', exJp: '今週の 水曜日 病院へ 行きます。', exVi: 'Thứ tư tuần này tôi sẽ đi bệnh viện.' },
            { kanji: '来週', hiragana: 'らいしゅう', meaning: 'Tuần sau', exJp: '来週 東京へ 行きます。', exVi: 'Tuần sau tôi sẽ đi Tokyo.' },
            { kanji: '先月', hiragana: 'せんげつ', meaning: 'Tháng trước', exJp: '先月 日本へ 来ました。', exVi: 'Tôi đã đến Nhật Bản tháng trước.' },
            { kanji: '今月', hiragana: 'こんげつ', meaning: 'Tháng này', exJp: '今月 どこへ 行きますか。', exVi: 'Tháng này bạn sẽ đi đâu?' },
            { kanji: '来月', hiragana: 'らいげつ', meaning: 'Tháng sau', exJp: '来月 国へ 帰ります。', exVi: 'Tháng sau tôi sẽ về nước.' },
            { kanji: '去年', hiragana: 'きょねん', meaning: 'Năm ngoái', exJp: '去年の 9月に 来ました。', exVi: 'Tôi đã đến vào tháng 9 năm ngoái.' },
            { kanji: '今年', hiragana: 'ことし', meaning: 'Năm nay', exJp: '今年 日本へ 来ました。', exVi: 'Năm nay tôi đã đến Nhật Bản.' },
            { kanji: '来年', hiragana: 'らいねん', meaning: 'Sang năm / Năm sau', exJp: '来年の 3月 アメリカへ 行きます。', exVi: 'Tháng 3 năm sau tôi sẽ đi Mỹ.' },
            { kanji: '～月', hiragana: '～がつ', meaning: 'Tháng ～', exJp: '3月25日に 来ました。', exVi: 'Tôi đã đến vào ngày 25 tháng 3.' },
            { kanji: '何月', hiragana: 'なんがつ', meaning: 'Tháng mấy', exJp: '何月に 日本へ 来ましたか。', exVi: 'Bạn đã đến Nhật Bản vào tháng mấy?' },
            { kanji: 'いつ', hiragana: 'いつ', meaning: 'Bao giờ / Khi nào', exJp: 'いつ 日本へ 来ましたか。', exVi: 'Khi nào bạn đã đến Nhật Bản?' },
            { kanji: '誕生日', hiragana: 'たんじょうび', meaning: 'Sinh nhật', exJp: '誕生日は 6月13日です。', exVi: 'Sinh nhật tôi là ngày 13 tháng 6.' }
        ];

        const extraDistractors = [
            "Học tập", "Nghỉ ngơi", "Thức dậy", "Bưu điện", "Ngân hàng",
            "Mỗi sáng", "Thứ hai", "Tối nay", "Căn phòng", "Máy vi tính"
        ];

        let currentIndex = 0;
        let answeredCurrent = false;
        let correctCount = 0;

        function updateCard() {
            const current = vocabList[currentIndex];
            document.getElementById('card-count').innerText = `${currentIndex + 1} / ${vocabList.length}`;
            document.getElementById('kanji-display').innerText = current.kanji;
            document.getElementById('hiragana-display').innerText = current.hiragana;
            document.getElementById('meaning-display').innerText = current.meaning;
            document.getElementById('example-jp').innerText = current.exJp;
            document.getElementById('example-vi').innerText = current.exVi;
            
            document.getElementById('card').classList.remove('flipped');
            answeredCurrent = false;

            let options = [current.meaning];
            vocabList.forEach(item => {
                if (!options.includes(item.meaning) && options.length < 4) {
                    options.push(item.meaning);
                }
            });

            let distractorIndex = 0;
            while (options.length < 4 && distractorIndex < extraDistractors.length) {
                let text = extraDistractors[distractorIndex];
                if (!options.includes(text)) {
                    options.push(text);
                }
                distractorIndex++;
            }

            options.sort(() => Math.random() - 0.5);

            const btns = document.querySelectorAll('.opt-btn');
            btns.forEach((btn, i) => {
                btn.innerText = options[i];
                btn.className = 'opt-btn';
                btn.disabled = false;
            });
        }

        function toggleFlip() {
            document.getElementById('card').classList.toggle('flipped');
        }

        function checkAnswer(btn) {
            if(answeredCurrent) return;
            answeredCurrent = true;

            document.getElementById('card').classList.add('flipped');

            if(btn.innerText === vocabList[currentIndex].meaning) {
                btn.classList.add('correct');
                correctCount++;
            } else {
                btn.classList.add('wrong');
            }

            const btns = document.querySelectorAll('.opt-btn');
            btns.forEach(b => b.disabled = true);
        }

        function nextCard() {
            if (currentIndex === vocabList.length - 1) {
                showCongrats();
                return;
            }
            currentIndex++;
            updateCard();
        }

        function prevCard() {
            if (currentIndex > 0) {
                currentIndex--;
                updateCard();
            }
        }

        function showCongrats() {
            document.getElementById('learning-section').style.display = 'none';
            document.getElementById('congrats-section').style.display = 'flex';
            document.getElementById('score-text').innerText = `${correctCount} / ${vocabList.length}`;
        }

        function restartLesson() {
            currentIndex = 0;
            correctCount = 0;
            document.getElementById('congrats-section').style.display = 'none';
            document.getElementById('learning-section').style.display = 'block';
            updateCard();
        }

        updateCard();
    </script>
</body>
</html>
